<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MWI DAB Server</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dab/static/css/style.css">

</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📻 MWI DAB Server</h1>
    <div class="sub">Digitaler DAB+-Stream · uGreen DAB Board · Icecast</div>

    <div class="dashboard">
      <div class="panel">
        <div class="logoBox">
          <img id="stationLogo" src="" alt="" style="display:none;">
          <div id="logoFallback">📻</div>
        </div>
        <div class="now" id="now">Noch kein Sender gewählt</div>
        <div class="trackbox">
          <div class="artist" id="artist"></div>
          <div class="title" id="title"></div>
        </div>
        <div class="text" id="radiotext">Radiotext erscheint hier.</div>
        <div class="small" id="status">Bereit.</div>
      </div>

      <div class="panel">
        <div>
          <span class="badge" id="ensemble">Ensemble: —</span>
          <span class="badge" id="freq">Frequenz: —</span>
          <span class="badge" id="valid">Signal: —</span>
        </div>

        <div class="metric">
          <div class="metric-row"><span>RSSI</span><span id="rssiText">—</span></div>
          <div class="bar"><div class="fill" id="rssiBar"></div></div>
        </div>

        <div class="metric">
          <div class="metric-row"><span>SNR</span><span id="snrText">—</span></div>
          <div class="bar"><div class="fill" id="snrBar"></div></div>
        </div>

        <div class="metric">
          <div class="metric-row"><span>FIC-Qualität</span><span id="ficText">—</span></div>
          <div class="bar"><div class="fill" id="ficBar"></div></div>
        </div>
      </div>
    </div>

    <audio id="player" controls autoplay>
      <source src="{{ stream_url }}" type="audio/mpeg">
    </audio>

    <div class="toolbar">
      <button class="secondary" onclick="reloadPlayer()">🔄 Player neu laden</button>
      <button class="secondary" onclick="refreshStatus()">📡 Status aktualisieren</button>
      <button class="secondary" onclick="stopRadio()">■ Stop</button>
    </div>

    <div class="grid">
      {% for s in stations %}
      <button id="station-{{ loop.index0 }}" onclick="playStation({{ loop.index0 }})">{{ s.label }}</button>
      {% endfor %}
    </div>

    <div class="footer">
      MWI DAB Server · Raspberry Pi Zero 2 W · uGreen DAB Board · Icecast
    </div>
  </div>
</div>

<script>
function setStatus(text) {
    document.getElementById("status").innerText = text;
}

function setBar(id, value, max) {
    let pct = 0;
    if (typeof value === "number") {
        pct = Math.max(0, Math.min(100, (value / max) * 100));
    }
    document.getElementById(id).style.width = pct + "%";
}

function markActive(id) {
    document.querySelectorAll(".grid button").forEach(b => b.classList.remove("active"));
    const btn = document.getElementById("station-" + id);
    if (btn) btn.classList.add("active");
}

function reloadPlayer() {
    const audio = document.getElementById("player");
    const source = audio.querySelector("source");
    source.src = "{{ stream_url }}?t=" + Date.now();
    audio.load();
    audio.play().catch(() => {});
}

async function playStation(id) {
    setStatus("Starte Sender...");
    try {
        const res = await fetch("/api/play/" + id, {method: "POST"});
        const data = await res.json();

        if (!data.ok) {
            setStatus("Fehler: " + (data.error || "unbekannt"));
            return;
        }

        document.getElementById("now").innerText = data.station.label;

        const logo = document.getElementById("stationLogo");
        const fallback = document.getElementById("logoFallback");
        logo.src = data.logo + "?t=" + Date.now();
        logo.style.display = "block";
        fallback.style.display = "none";
        logo.onerror = function() {
            logo.style.display = "none";
            fallback.style.display = "block";
        };

        markActive(id);
        reloadPlayer();
        setStatus("Läuft.");
        setTimeout(refreshStatus, 1500);
    } catch (e) {
        setStatus("Fehler: " + e);
    }
}

async function stopRadio() {
    setStatus("Stoppe...");
    await fetch("/api/stop", {method: "POST"});
    document.getElementById("now").innerText = "Noch kein Sender gewählt";
    document.getElementById("radiotext").innerText = "Radiotext erscheint hier.";
    document.querySelectorAll(".grid button").forEach(b => b.classList.remove("active"));
    setStatus("Gestoppt.");
}

    try {
        const res = await fetch("/api/status?t=" + Date.now());
        const data = await res.json();

        const meta = data.metadata || {};
        const dig = meta.digrad_status || {};
        const ens = meta.ensemble_info || {};

        if (data.current && data.current.label) {
            document.getElementById("now").innerText = data.current.label;
        }

        document.getElementById("radiotext").innerText =
            meta.station_text || "Kein Radiotext empfangen.";
